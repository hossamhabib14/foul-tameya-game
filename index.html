<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b3a2a">
<title>فول وطعمية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="moneyBox"><span class="coin"></span><b id="money">٠</b><small>ج</small></div>
    <div id="lvlBox"><div id="lvlTxt">مستوى ١</div><div id="fameBar"><i id="fameFill"></i></div></div>
    <button id="gear" aria-label="الإعدادات">⚙</button>
  </div>
  <div id="bottom">
    <button id="btnUp" class="btn green">تطوير</button>
    <button id="btnBonus" class="btn gold">مكافأة مجانية</button>
  </div>
  <div id="banner"></div>
  <div id="toast"></div>
</div>

<div id="modal" class="hidden"><div id="sheet"></div></div>

<div id="loading"><div class="ltitle">فول وطعمية</div><div class="lbar"><i id="lfill"></i></div><div class="lsub">جاري تحضير الفول...</div></div>

<script src="js/config.js"></script>
<script src="js/manifest.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>

<script src="js/main.js"></script>

</html>
